{% include base_path %}

<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button type="button" aria-label="Open navigation menu" aria-expanded="false"><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg">
            <a class="site-brand" href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>
              <span class="site-brand__mark" aria-hidden="true">MT</span>
              <span>{{ site.title }}</span>
            </a>
          </li>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign nav_url = link.url %}
            {% else %}
              {% assign nav_url = link.url | relative_url %}
            {% endif %}
            <li class="masthead__menu-item"><a href="{{ nav_url }}"{% if page.url == link.url %} aria-current="page"{% endif %}{% if link.target %} target="{{ link.target }}"{% endif %}>{{ link.title }}</a></li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
